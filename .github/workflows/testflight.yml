name: TestFlight Beta

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: dumpit_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          working-directory: dumpit_mobile

      - name: Bundle install
        working-directory: dumpit_mobile
        env:
          BUNDLE_FROZEN: "false"
        run: bundle install

      - name: Write App Store Connect API key (JSON)
        run: |
          cat > api_key.json <<EOF
          {
            "key_id": "$APP_STORE_CONNECT_API_KEY_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_API_KEY_ISSUER_ID",
            "key": "$(echo "$APP_STORE_CONNECT_API_KEY_KEY" | awk '{printf "%s\\n", $0}')",
            "in_house": false
          }
          EOF
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}

      - name: fastlane beta (build + upload to TestFlight)
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: bundle exec fastlane beta
